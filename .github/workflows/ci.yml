# GitHub Actions CI Pipeline for EchoTeam

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # Type check and lint for TypeScript
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "fullstack/pnpm-lock.yaml"

      - name: Install dependencies
        run: cd fullstack && pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: cd fullstack && pnpm exec tsc --noEmit

  # Build frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "fullstack/pnpm-lock.yaml"

      - name: Install dependencies
        run: cd fullstack && pnpm install --frozen-lockfile

      - name: Build frontend
        run: cd fullstack && pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: fullstack/dist/
          retention-days: 7

  # Test and lint Python AI service
  test-ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "apps/ai-service/requirements.txt"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: cd apps/ai-service && uv pip install -e ".[dev]"

      - name: Run tests
        run: cd apps/ai-service && uv run pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/ai-service/coverage.xml
          flags: python
          name: AI Service Coverage

  # Build API server
  build-api:
    name: Build API Server
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "fullstack/pnpm-lock.yaml"

      - name: Install dependencies
        run: cd fullstack && pnpm install --frozen-lockfile

      - name: Build API server
        run: cd fullstack && npx tsc --noEmit server/

  # Docker build and push (optional - for registry)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-frontend, test-ai-service, build-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Service image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-service
          push: false
          tags: echoteam/ai-service:latest
          load: true

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./fullstack
          push: false
          tags: echoteam/api:latest
          load: true

  # Summary
  success:
    name: Success
    runs-on: ubuntu-latest
    needs: [typecheck, build-frontend, test-ai-service, build-api]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "TypeScript type check failed"
            exit 1
          fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "Frontend build failed"
            exit 1
          fi
          if [ "${{ needs.test-ai-service.result }}" != "success" ]; then
            echo "AI Service tests failed"
            exit 1
          fi
          if [ "${{ needs.build-api.result }}" != "success" ]; then
            echo "API build failed"
            exit 1
          fi
          echo "All checks passed!"
